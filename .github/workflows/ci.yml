name: Phase 11 CI Build & Test

on:
  push:
    branches: [ "main", "integration/*" ]
  pull_request:
    branches: [ "main", "integration/*" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Node Dependencies (API Gateway & Web)
        run: |
          npm ci
          cd Patient-case-taking-software- && npm ci

      - name: Install Python Dependencies (RAG Service)
        run: |
          pip install -r services/rag_service/requirements.txt httpx

      - name: Generate Prisma Client (SQLite local tests)
        run: |
          npx prisma generate --schema=prisma/schema.sqlite.prisma

      - name: Initialize CI SQLite Database
        run: |
          npx prisma db push --schema=prisma/schema.sqlite.prisma
          node scripts/migrate_db_json.js

      - name: Install System OCR Dependencies (Tesseract & Devanagari)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-hin fonts-deva fonts-lohit-deva
          tesseract --version
          tesseract --list-langs
          tesseract --list-langs | grep eng
          tesseract --list-langs | grep hin
          # Provide Devanagari font for test image generation matching Windows font paths
          DEVA_FONT=$(find /usr/share/fonts -name "*Deva*.ttf" -o -name "*deva*.ttf" -o -name "*Lohit*.ttf" | head -n 1)
          if [ -n "$DEVA_FONT" ]; then
            echo "Found Devanagari font: $DEVA_FONT"
            cp "$DEVA_FONT" 'C:\Windows\Fonts\Nirmala.ttf'
            cp "$DEVA_FONT" 'C:\Windows\Fonts\mangal.ttf'
            mkdir -p "Patient-case-taking-software-"
            cp "$DEVA_FONT" Patient-case-taking-software-/'C:\Windows\Fonts\Nirmala.ttf' 2>/dev/null || true
            cp "$DEVA_FONT" Patient-case-taking-software-/'C:\Windows\Fonts\mangal.ttf' 2>/dev/null || true
          fi

      - name: Run Node Integration Test Suite
        run: |
          npm run test:all

      - name: Run Python Tests
        run: |
          python -m unittest tests/test_phase5e_rag.py

      - name: Build Production Frontend
        run: |
          npm run build:web
