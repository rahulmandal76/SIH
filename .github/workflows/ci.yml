name: Phase 11 CI Build & Test

on:
  push:
    branches: [ "main", "integration/*" ]
  pull_request:
    branches: [ "main", "integration/*" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Node Dependencies (API Gateway & Web)
        run: |
          npm ci
          cd Patient-case-taking-software- && npm ci

      - name: Install Python Dependencies (RAG Service)
        run: |
          pip install -r services/rag_service/requirements.txt

      - name: Generate Prisma Client (SQLite local tests)
        run: |
          npx prisma generate --schema=prisma/schema.sqlite.prisma

      - name: Initialize CI SQLite Database
        run: |
          npx prisma db push --schema=prisma/schema.sqlite.prisma
          node scripts/migrate_db_json.js

      - name: Run Node Integration Test Suite
        run: |
          npm run test:all

      - name: Run Python Tests
        run: |
          python -m unittest tests/test_phase5e_rag.py

      - name: Build Production Frontend
        run: |
          npm run build:web
