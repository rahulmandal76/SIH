name: Phase 11 CI Build & Test

on:
  push:
    branches: [ "main", "integration/*" ]
  pull_request:
    branches: [ "main", "integration/*" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Node Dependencies (API Gateway & Web)
        run: |
          npm ci
          cd Patient-case-taking-software- && npm ci

      - name: Generate Prisma Client (SQLite local tests)
        run: |
          npx prisma generate --schema=prisma/schema.sqlite.prisma

      - name: Install Python Dependencies (RAG Service)
        run: |
          pip install -r services/rag_service/requirements.txt

      - name: Build Production Frontend
        run: |
          npm run build:web

      - name: Run Core Integration Tests
        run: |
          # Node integration tests
          npm run test:phase2
          npm run test:phase3
          npm run test:phase4
          npm run test:phase5
          npm run test:phase5b
          npm run test:phase5c
          npm run test:phase5d
          npm run test:phase5e
          npm run test:phase5f
          npm run test:phase5g
          # Python unit tests
          python -m unittest tests/test_phase5e_rag.py
