version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - DATABASE_PROVIDER=postgresql
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/medsync?schema=public}
      - RAG_SERVICE_INTERNAL_TOKEN=${RAG_SERVICE_INTERNAL_TOKEN}
      - SESSION_SECRET=${SESSION_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      rag:
        condition: service_started
    restart: unless-stopped

  rag:
    build:
      context: .
      dockerfile: Dockerfile.rag
    ports:
      - "8000:8000"
    environment:
      - RAG_SERVICE_INTERNAL_TOKEN=${RAG_SERVICE_INTERNAL_TOKEN}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - VECTOR_INDEX_ROOT=/data/vector_index
    volumes:
      - vector_data:/data/vector_index
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: medsync
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  vector_data:
